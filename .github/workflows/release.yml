name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check signing secrets
        id: secrets
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured; skipping the release build."
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::notice::Not a v* tag ref; build and release steps are skipped." ;;
          esac

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')

      - name: Install tools
        if: steps.secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: brew install xcodegen

      - name: Import signing certificate
        if: steps.secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Test
        if: steps.secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: swift test --package-path CruxShotKit

      - name: Build, sign and notarize
        if: steps.secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        if: steps.secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then RELEASE_FLAGS+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" --generate-notes "${RELEASE_FLAGS[@]}" \
            build/CruxShotter-*.dmg build/appcast.xml

      # Publish the feed only after the corresponding DMG is publicly available.
      - name: Publish signed update feed
        if: steps.secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin feat/v1
          git checkout feat/v1
          cp build/appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet || git commit -m "chore: publish signed update feed for $GITHUB_REF_NAME"
          git push origin feat/v1
