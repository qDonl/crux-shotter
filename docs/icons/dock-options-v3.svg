<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#FFFFFF"/>
<style>text{font-family:-apple-system,"PingFang SC",sans-serif}.h{font-size:30px;font-weight:600;fill:#222}.l{font-size:24px;fill:#222;font-weight:600}.s{font-size:18px;fill:#666}</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6FD8"/><stop offset=".5" stop-color="#FF9A5A"/><stop offset="1" stop-color="#7B5CFF"/></linearGradient>
<linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E7CFF"/><stop offset="1" stop-color="#4B33D6"/></linearGradient>
<linearGradient id="y1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFB627"/></linearGradient>
<path id="br" d="M300 400V300h100M624 300h100v100M724 624v100H624M400 724H300V624" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g id="F1"><g clip-path="url(#sq)"><rect x="100" y="100" width="824" height="824" fill="#EEF2FF"/><g filter="url(#blur)"><circle cx="300" cy="300" r="260" fill="#5AA9FF"/><circle cx="760" cy="360" r="240" fill="#FF7AC6"/><circle cx="520" cy="780" r="260" fill="#7CF0C8"/></g></g><rect x="100" y="100" width="824" height="824" rx="185" fill="none" filter="url(#sh)"/><rect x="250" y="250" width="524" height="524" rx="80" fill="#FFFFFF" fill-opacity="0.55" stroke="#fff" stroke-width="6"/><use href="#br" stroke="#1C1C1E" stroke-width="54" transform="translate(512 512) scale(.8) translate(-512 -512)"/></g>
<g id="F2"><rect x="100" y="100" width="824" height="824" rx="185" fill="#FFFFFF" stroke="#DADCE0" stroke-width="4" filter="url(#sh)"/><use href="#br" stroke="#1C1C1E" stroke-width="26"/></g>
<g id="F3"><g clip-path="url(#sq)"><rect x="100" y="100" width="824" height="824" fill="#1F2A6B"/><path d="M100 100H924L100 924Z" fill="#FF7A45"/></g><rect x="100" y="100" width="824" height="824" rx="185" fill="none" filter="url(#sh)"/><use href="#br" stroke="#fff" stroke-width="70"/></g>
<g id="F4"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#p1)" filter="url(#sh)"/><rect x="320" y="250" width="420" height="320" rx="30" fill="#B9AEFF"/><rect x="280" y="330" width="420" height="320" rx="30" fill="#D9D3FF"/><rect x="240" y="410" width="420" height="320" rx="30" fill="#FFFFFF" filter="url(#sh)"/><rect x="300" y="470" width="190" height="140" rx="10" fill="#6C5CE7" fill-opacity=".2" stroke="#6C5CE7" stroke-width="14" stroke-dasharray="30 20"/></g>
<g id="F5"><rect x="100" y="100" width="824" height="824" rx="185" fill="#1E3A2F" filter="url(#sh)"/><g fill="#7CFF6B"><rect x="280" y="280" width="160" height="56"/><rect x="280" y="280" width="56" height="160"/><rect x="584" y="280" width="160" height="56"/><rect x="688" y="280" width="56" height="160"/><rect x="280" y="688" width="160" height="56"/><rect x="280" y="584" width="56" height="160"/><rect x="584" y="688" width="160" height="56"/><rect x="688" y="584" width="56" height="160"/><rect x="484" y="484" width="56" height="56" fill="#FFE066"/></g></g>
<g id="F6"><rect x="100" y="100" width="824" height="824" rx="185" fill="#0B0B1A" filter="url(#sh)"/><g filter="url(#glow)"><path d="M300 400V300h100M624 300h100v100" fill="none" stroke="#3DF5FF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M724 624v100H624M400 724H300V624" fill="none" stroke="#FF4FD8" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<g id="F7"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#y1)" filter="url(#sh)"/><path d="M220 760H804" stroke="#5A3A00" stroke-width="24" stroke-dasharray="44 30" stroke-linecap="round"/><g fill="none" stroke="#1C1C1E" stroke-width="44" stroke-linecap="round"><circle cx="330" cy="340" r="80"/><circle cx="330" cy="560" r="80"/><path d="M400 380L760 640"/><path d="M400 520L760 260"/></g></g>
<g id="F8"><rect x="100" y="100" width="824" height="824" rx="185" fill="#FF8A65" filter="url(#sh)"/><g transform="rotate(-8 512 512)"><rect x="270" y="230" width="484" height="580" rx="18" fill="#FFFDF7" filter="url(#sh)"/><rect x="310" y="270" width="404" height="380" rx="8" fill="#3E5BA9"/><path d="M310 600l120-120 90 90 70-70 124 124v26H310z" fill="#7FB3FF"/><circle cx="640" cy="350" r="34" fill="#FFD54F"/></g></g>
<g id="F9"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#a1)" filter="url(#sh)"/><path d="M700 300H330a30 30 0 0 0-30 30v364a30 30 0 0 0 30 30h370" fill="none" stroke="#fff" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs>
<text x="40" y="56" class="h">Dock 应用图标候选（第三批，9 种风格）</text>
<svg x="70" y="80" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F1"/></svg>
<svg x="475" y="80" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F2"/></svg>
<svg x="880" y="80" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F3"/></svg>
<text x="195" y="358" text-anchor="middle" class="l">F1 毛玻璃</text><text x="195" y="384" text-anchor="middle" class="s">彩色光晕 + 玻璃卡片</text>
<text x="600" y="358" text-anchor="middle" class="l">F2 极简线条</text><text x="600" y="384" text-anchor="middle" class="s">白底细线，最克制</text>
<text x="1005" y="358" text-anchor="middle" class="l">F3 撞色</text><text x="1005" y="384" text-anchor="middle" class="s">橙蓝对角分割</text>
<svg x="70" y="420" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F4"/></svg>
<svg x="475" y="420" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F5"/></svg>
<svg x="880" y="420" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F6"/></svg>
<text x="195" y="698" text-anchor="middle" class="l">F4 层叠立体</text><text x="195" y="724" text-anchor="middle" class="s">多张截图叠放</text>
<text x="600" y="698" text-anchor="middle" class="l">F5 复古像素</text><text x="600" y="724" text-anchor="middle" class="s">8-bit 程序员味</text>
<text x="1005" y="698" text-anchor="middle" class="l">F6 霓虹</text><text x="1005" y="724" text-anchor="middle" class="s">暗底发光描边</text>
<svg x="70" y="760" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F7"/></svg>
<svg x="475" y="760" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F8"/></svg>
<svg x="880" y="760" width="250" height="250" viewBox="0 0 1024 1024"><use href="#F9"/></svg>
<text x="195" y="1038" text-anchor="middle" class="l">F7 剪刀</text><text x="195" y="1064" text-anchor="middle" class="s">沿虚线剪下</text>
<text x="600" y="1038" text-anchor="middle" class="l">F8 拍立得</text><text x="600" y="1064" text-anchor="middle" class="s">拍下一张照片</text>
<text x="1005" y="1038" text-anchor="middle" class="l">F9 渐变字母 C</text><text x="1005" y="1064" text-anchor="middle" class="s">品牌感强</text>
<text x="40" y="1140" class="s">第一批 D1–D4、第二批 E1–E6 仍可选；也可以混搭，例如“F3 的配色 + E1 的符号”。</text>
</svg>
